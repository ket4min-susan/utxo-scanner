[package]
name = "ootle-utxo-monitor"
description = "Monitors, decrypts, and serves the stealth UTXOs of an Ootle resource"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "ootle-utxo-monitor"
path = "src/main.rs"

[dependencies]
utxo-monitor-core = { workspace = true }
ootle-rs = { workspace = true }
tari_ootle_common_types = { workspace = true }
tari_template_lib_types = { workspace = true }
tari_crypto = { workspace = true }

anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
mime_guess = { workspace = true }
rust-embed = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
