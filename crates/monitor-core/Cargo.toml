[package]
name = "utxo-monitor-core"
description = "Ingestion, storage, and decryption core for the Ootle stealth-UTXO monitor"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ootle-rs = { workspace = true }
tari_ootle_common_types = { workspace = true }
tari_template_lib_types = { workspace = true }
tari_crypto = { workspace = true }

chrono = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
sqlx = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
