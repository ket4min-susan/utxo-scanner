[workspace]
resolver = "3"
members = ["crates/monitor-core", "crates/monitor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
authors = ["The Tari Development Community"]
repository = "https://github.com/tari-project/ootle-utxo-monitor"

[workspace.dependencies]
utxo-monitor-core = { path = "crates/monitor-core" }

# Ootle dependencies (published on crates.io).
ootle-rs = { version = "0.14.0", features = ["mmap-value-lookup"] }
tari_ootle_common_types = "0.35.2"
tari_template_lib_types = "0.28.0"
tari_crypto = "0.23"

anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
mime_guess = "2"
rand = "0.10"
rust-embed = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["trace"] }
sqlx = { version = "0.8", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "chrono",
    "macros",
    "migrate",
] }
thiserror = "2"
tokio = { version = "1", default-features = false }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
